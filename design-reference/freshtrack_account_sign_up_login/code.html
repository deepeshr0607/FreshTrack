<script>
  let currentAuthMode = 'signup';

  function switchAuthMode(mode) {
    currentAuthMode = mode;
    const tabIndicator = document.getElementById('tabIndicator');
    const btnTabSignUp = document.getElementById('btnTabSignUp');
    const btnTabLogIn = document.getElementById('btnTabLogIn');
    const title = document.getElementById('authTitle');
    const subtitle = document.getElementById('authSubtitle');
    const fieldFullName = document.getElementById('fieldFullName');
    const digestCheckboxLabel = document.getElementById('digestCheckboxLabel');
    const passwordStrengthBox = document.getElementById('passwordStrengthBox');
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');
    const btnSubmitText = document.getElementById('btnSubmitText');
    const toggleTextPrompt = document.getElementById('toggleTextPrompt');
    const btnToggleMode = document.getElementById('btnToggleMode');

    if (mode === 'signup') {
      tabIndicator.style.left = '4px';
      btnTabSignUp.classList.replace('text-on-surface-variant', 'text-primary');
      btnTabLogIn.classList.replace('text-primary', 'text-on-surface-variant');

      title.textContent = 'Create Your Account';
      subtitle.textContent = 'Join 15,000+ smart kitchens cutting grocery bills & food waste.';

      fieldFullName.classList.remove('hidden');
      digestCheckboxLabel.classList.remove('hidden');
      passwordStrengthBox.classList.remove('hidden');
      forgotPasswordLink.classList.add('hidden');

      btnSubmitText.textContent = 'Create Account';
      toggleTextPrompt.textContent = 'Already have an account?';
      btnToggleMode.textContent = 'Log In';
    } else {
      tabIndicator.style.left = 'calc(50% + 0px)';
      btnTabLogIn.classList.replace('text-on-surface-variant', 'text-primary');
      btnTabSignUp.classList.replace('text-primary', 'text-on-surface-variant');

      title.textContent = 'Welcome Back';
      subtitle.textContent = 'Log in to audit your kitchen shelves and pending expiries.';

      fieldFullName.classList.add('hidden');
      digestCheckboxLabel.classList.add('hidden');
      passwordStrengthBox.classList.add('hidden');
      forgotPasswordLink.classList.remove('hidden');

      btnSubmitText.textContent = 'Sign In';
      toggleTextPrompt.textContent = "Don't have an account?";
      btnToggleMode.textContent = 'Sign Up';
    }
  }

  function toggleModeCurrent() {
    switchAuthMode(currentAuthMode === 'signup' ? 'login' : 'signup');
  }

  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('passwordEyeIcon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }
</script></main></body></html>
